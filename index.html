<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The River</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Giriş Ekranı */
        #login-container {
            text-align: center;
            background: #111;
            padding: 30px;
            border: 2px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
            z-index: 10;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            background: #000;
            border: 1px solid #ff3333;
            color: #fff;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #ff3333;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Gerici Ana Ekran */
        #river-screen {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #050505;
        }

        .creepy-title {
            text-align: center;
            margin-top: 20%;
            font-size: 3rem;
            letter-spacing: 10px;
            animation: flicker 2s infinite;
        }

        /* Gizli Butonlar */
        .fake-btn {
            position: absolute;
            background: transparent;
            border: 1px solid #222;
            color: #333;
            padding: 5px;
            cursor: pointer;
        }

        /* Sol Üstteki Gerçek Gizli Buton */
        #secret-trigger {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        /* Özel Albüm Sayfası */
        #album-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ffe3e3 0%, #ffd1d1 100%);
            color: #d63031;
            text-align: center;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .album-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.5rem;
            margin-top: 20px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 5px solid #fff;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="login-container">
        <h2>THE RIVER - ACCESS PANEL</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Parola">
        <button onclick="checkLogin()">SİSTEME GİRİŞ</button>
    </div>

    <div id="river-screen">
        <button id="secret-trigger" onclick="openAlbum()" title="Gizli Yol"></button>

        <div class="creepy-title">THE RIVER RUNS DEEP</div>
        
        <button class="fake-btn" style="top: 40%; left: 20%;" onclick="alert('Burada hiçbir şey yok...')">GİRİŞ</button>
        <button class="fake-btn" style="top: 60%; left: 70%;" onclick="alert('Yanlış patika!')">FOTOĞRAFLAR</button>
        <button class="fake-btn" style="top: 80%; left: 45%;" onclick="alert('Derine, daha derine...')">TIKLA</button>
    </div>

    <div id="album-screen">
        <h1 class="album-title">THERE IS NOT A RIVER THERE IS MY HEART ❤️</h1>
        <p>Gizli yolu bulabildin!.</p>
        
        <div class="gallery">
            <img src="IMG-20260715-WA0000.jpg" alt="SEN">
            <img src="Screenshot_20260709-230141.png" alt="YİNE SEN">
            <img src="Screenshot_20260706-235054.png" alt="SADECE SEN">
            <img src="IMG_20260629_233842_280.png" alt="BİZ">
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === "esmos" && pass === "160408") {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('river-screen').style.display = 'block';
            } else {
                alert("Hatalı Giriş! Nehir seni yuttu.");
            }
        }

        function openAlbum() {
            document.getElementById('river-screen').style.display = 'none';
            document.getElementById('album-screen').style.display = 'block';
            document.body.style.backgroundColor = "#ffe3e3";
        }
    </script>
    
</body>
</html>
